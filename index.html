<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Next Watch</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
         ========================= -->

    <header class="site-header">

        <div class="brand">
            <span class="brand-icon">▶</span>
            <h1>Next Watch</h1>
        </div>

        <p class="tagline">
            Find your next favourite movie.
        </p>

    </header>



    <!-- =========================
         MOVIE COMPARE
         ========================= -->

    <section class="compare-section">

      <div class="section-heading">

    <h2>Put two movies head-to-head.</h2>

</div>


        <div class="comparison-section">

            <div class="movie-input">

                <label for="movie1">First movie</label>

                <input
                    type="text"
                    id="movie1"
                    placeholder="Enter a movie"
                >

            </div>


            <div class="vs">VS</div>


            <div class="movie-input">

                <label for="movie2">Second movie</label>

                <input
                    type="text"
                    id="movie2"
                    placeholder="Enter a movie"
                >

            </div>


            <button
                id="searchBtn"
                class="compare-btn"
            >
                Compare Movies
                <span>→</span>
            </button>

        </div>

    </section>



    <!-- =========================
         FILTERS
         ========================= -->

    <section class="filters-section">

        <div class="filter-row">


            <!-- STREAMING PLATFORM -->

            <div class="streaming-filter">

              <button
    type="button"
    id="streamingDropdownButton"
    class="streaming-dropdown-button"
>
    <span>Platforms</span>
</button>


                <div
                    id="streamingDropdownMenu"
                    class="streaming-dropdown-menu"
                >

                    <div class="streaming-dropdown-title">
                        Available on
                    </div>


                    <label class="platform-option">

                        <input
                            type="checkbox"
                            value="Netflix"
                            class="platform-checkbox"
                        >

                        <span>Netflix</span>

                    </label>


                    <label class="platform-option">

                        <input
                            type="checkbox"
                            value="Binge"
                            class="platform-checkbox"
                        >

                        <span>Binge</span>

                    </label>


                    <label class="platform-option">

                        <input
                            type="checkbox"
                            value="Disney+"
                            class="platform-checkbox"
                        >

                        <span>Disney+</span>

                    </label>


                    <label class="platform-option">

                        <input
                            type="checkbox"
                            value="Prime Video"
                            class="platform-checkbox"
                        >

                        <span>Prime Video</span>

                    </label>


                    <label class="platform-option">

                        <input
                            type="checkbox"
                            value="Stan"
                            class="platform-checkbox"
                        >

                        <span>Stan</span>

                    </label>


                    <label class="platform-option">

                        <input
                            type="checkbox"
                            value="Apple TV+"
                            class="platform-checkbox"
                        >

                        <span>Apple TV+</span>

                    </label>


                    <label class="platform-option">

                        <input
                            type="checkbox"
                            value="HBO Max"
                            class="platform-checkbox"
                        >

                        <span>HBO Max</span>

                    </label>


                    <label class="platform-option">

                        <input
                            type="checkbox"
                            value="Foxtel Now"
                            class="platform-checkbox"
                        >

                        <span>Foxtel Now</span>

                    </label>

                </div>

            </div>



            <!-- GENRE -->

            <div class="genre-filter">

                <select id="genreSelect">

                    <option value="">
                        Genre
                    </option>

                    <option value="28">
                        Action
                    </option>

                    <option value="12">
                        Adventure
                    </option>

                    <option value="16">
                        Animation
                    </option>

                    <option value="35">
                        Comedy
                    </option>

                    <option value="80">
                        Crime
                    </option>

                    <option value="18">
                        Drama
                    </option>

                    <option value="27">
                        Horror
                    </option>

                    <option value="878">
                        Sci-Fi
                    </option>

                    <option value="53">
                        Thriller
                    </option>

                    <option value="10749">
                        Romance
                    </option>

                </select>

            </div>


        </div>

    </section>



    <!-- =========================
         WATCH OPTIONS
         ========================= -->

    <section class="watch-options-section">

        <div class="watch-options">


            <!-- WATCH-OFF -->

            <button
                id="randomBattleBtn"
                class="watch-option-card"
            >

                <span class="watch-option-icon">VS</span>

                <span class="watch-option-content">

                    <strong>Watch-Off</strong>

                    <small>
                        Two movies enter. One wins.
                    </small>

                </span>

                <span class="watch-option-arrow">→</span>

            </button>



            <!-- WATCH NEXT -->

            <button
                id="randomMovieBtn"
                class="watch-option-card"
            >

                <span class="watch-option-icon">✦</span>

                <span class="watch-option-content">

                    <strong>Watch Next</strong>

                    <small>
                        Pick a movie for me.
                    </small>

                </span>

                <span class="watch-option-arrow">→</span>

            </button>


        </div>

    </section>



    <!-- =========================
         RESULTS
         ========================= -->

    <div id="topMovieList"></div>


    <p id="status"></p>


    <div id="result"></div>


</div>



<script src="script.js?v=2"></script>


</body>

</html>
